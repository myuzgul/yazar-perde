version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://perde_user:perde_secure_pass_2026@postgres:5432/perde_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_super_secret_jwt_key_2026
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: perde_user
      POSTGRES_PASSWORD: perde_secure_pass_2026
      POSTGRES_DB: perde_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
